name: Build BK7231N IRremoteESP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BK7231N IRremoteESP
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # actions/checkout v5.0.0, pinned to exact commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail

          make VARIANT=irRemoteESP OpenBK7231N

      - name: Verify and prepare OTA firmware
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find output -type f -name 'OpenBK7231N_*.rbl' -print
          )

          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one BK7231N .rbl file."
            echo "Found: ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi

          mkdir -p artifact

          cp "${files[0]}" artifact/OpenBK7231N_irRemoteESP.rbl

          {
            echo "Source repository: $GITHUB_REPOSITORY"
            echo "Source commit:     $GITHUB_SHA"
            echo
            echo "Firmware SHA256:"
            sha256sum artifact/OpenBK7231N_irRemoteESP.rbl
          } | tee artifact/build-info.txt

      - name: Upload OTA firmware
        # actions/upload-artifact v6.0.0, pinned to exact commit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: OpenBK7231N-irRemoteESP
          path: artifact/
          if-no-files-found: error
          retention-days: 7
